<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="style.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <img src="favicon.png">
                <div>
                    <h1>TO Do List</h1>
                    <a href="https://github.com/payron-A">Github Account</a>
                </div>
            </div>
            <div class="header-text">
                <p>
                    Add ,Remove ,and Edit any task with this JavaScript project
                </p>
            </div>
            <div class="header-input input">
                <input type="input"id="headerinput" placeholder="Add Task...">
                <button class="input-button"id="headerButton">
                    Add
                </button>
            </div>
        </header>
        <div class="task-main"></div>
    </div>
    <script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">
    <title>notekeeper</title>
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-inner">
            <div class="logo">
                <i class="fa-solid fa-pen-nib"></i>
                notekeeper
            </div>
            <div class="nb-section">
                <div class="nb-add-btn">
                    <i class="fa-solid fa-plus"></i>
                    New Notebook
                </div>
                <div id="nb-list">
                </div>
            </div>
        </div>
    </div>
    <div class="main">
        <div class="topbar">
            <div class="topbar-left">
                <h1 id="greeting">Good Evening</h1>
            </div>
            <div class="theme-toggle" id="themeBtn">
                <i id="theme-icon"></i>
                <span id="theme-label"></span>
            </div>
        </div>
        <div class="notes-grid" id="notes-grid"></div>
    </div>
    <div class="fab" title="new note">
        <i class="fa-solid fa-plus"></i>
    </div>
    <!-- input of notes -->
    <div class="overlay">
        <div class="note-modal">
            <h2>New Note</h2>
            <input type="text" placeholder="Tag (e.g. Study)" class="input" id="tag-ipt">
            <input type="text" placeholder="Title" class="input" id="title-ipt">
            <textarea placeholder="Preview..." class="input textarea" id="preview-ipt"></textarea>
            <div class="actions">
                <button class="btn cancel">Cancel</button>
                <button class="btn save">Save</button>
            </div>
        </div>
        <!-- input of notebooks -->
        <div class="notebook-modal">
            <h2>New Notebook</h2>
            <input type="text" placeholder="notebook name " class="input" id="nb-ipt">
            <div class="actions">
                <button class="btn cancel">Cancel</button>
                <button class="btn save">Save</button>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
